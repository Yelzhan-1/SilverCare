name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (lint)
        run: npm run lint

      - name: Build
        env:
          # Shape-valid CI-only dummies so check-env.mjs can pass.
          # NOT real credentials — do not copy these to Vercel.
          # Production/preview on Vercel must use real Project Settings env.
          VITE_SUPABASE_URL: https://ci-build.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1jaSIsInJvbGUiOiJhbm9uIiwiaWF0IjoxfQ.ci-build-not-a-secret
          VITE_VAPID_PUBLIC_KEY: CI_BUILD_VAPID_PUBLIC_KEY
        run: npm run build
